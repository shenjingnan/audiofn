name: npm Publish (dsh-plugin)

# 发布 integrations/dsh-plugin → npm @zapmomo-ai/dsh-plugin。
# 触发：手动 dispatch，或推送 zapmomo 主版本 tag `v*`（release-plz 生成的 vX.Y.Z）——
# 插件版本跟随 zapmomo 主版本自动发布，无需单独打插件 tag。
#
# 认证走 npm Trusted Publishing（OIDC），不依赖 NPM_TOKEN：
# - npm 侧已为 @zapmomo-ai/dsh-plugin 配置 Trusted Publisher（绑定本仓库 + 本 workflow 文件名）
# - GitHub 注入 OIDC id-token，npm CLI（>= 11.5.1）自动用它认证并生成 provenance
# - 要求 npm 侧「Workflow filename」= npm-publish.yml，且「Environment」留空
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # zapmomo 主版本 tag（release-plz 生成；与 release.yml 桌面包构建并行触发）

permissions:
  contents: read
  id-token: write # OIDC Trusted Publishing 必需

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/dsh-plugin
    steps:
      - uses: actions/checkout@v7
      # 版本单一来源 .node-version（= 24，与本地 fnm / 其它 CI 读同一文件）。
      # Node 24 捆绑 npm >= 11.17（本地实测 24.19.0 -> npm 11.17.0），满足 OIDC 要求的 >= 11.5.1，
      # 无需额外升级 npm。
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      # 跟随 zapmomo 主版本：把插件 version 覆盖为当前 tag 的版本（v0.1.18 -> 0.1.18）。
      # 只改工作区副本、不提交不 tag（--no-git-tag-version）。手动 dispatch 时跳过（用 package.json 现有版本）。
      - name: Align version to zapmomo tag
        if: github.event_name == 'push'
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version
      - name: Publish to npm
        run: npm publish
