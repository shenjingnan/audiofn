name: Release

# 每次 release-plz 创建 vX.Y.Z tag（推送）后，在原生 runner 上构建
# macOS（双架构）/ Linux 的安装包，合并到一个 GitHub Release。
# 构建成功后自动发布为正式 Release。
#
# 发布走 PAT_TOKEN Secret（与 publish.yml 的 release-plz 共用同一 PAT，具备
# Contents 读写权限）而非默认 GITHUB_TOKEN：GITHUB_TOKEN 产生的事件不触发其他
# workflow（GitHub 防递归机制），upload-baidu-pan.yml 依赖 release: published
# 事件自动上传百度网盘，用 GITHUB_TOKEN 发布会让它永远静默不触发（无失败记录）。
# PAT 过期/失效时下方 Check release token 步骤会提前报错。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # audio.cpp 引擎版本，据此 tag 源码编译 sidecar（v0.7.x 起 tag 带 v 前缀）。
  # 升级引擎只改这一行（与 tauri.conf.json 同步审查）。
  AUDIOCPP_REF: v0.7.1

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            runner: macos-latest
            # triple 供下方 Stage macOS bundles 步骤定位 bundle 产物目录
            # （target/<triple>/release/bundle），不挪用语义专属的 audiocpp_triple
            triple: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin'
            audiocpp_triple: aarch64-apple-darwin
            # arm64 保留 Metal（大模型可走 GPU；小模型实测 CPU 更快，运行时按 [tts].provider 选择）
            audiocpp_extra: '-DENGINE_ENABLE_METAL=ON -DENGINE_ENABLE_CUDA=OFF'
          - platform: macos-latest
            runner: macos-latest
            triple: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin'
            audiocpp_triple: x86_64-apple-darwin
            # ARM runner 上交叉编译 x86_64：Metal 关闭（Intel Mac 走 CPU）
            audiocpp_extra: '-DENGINE_ENABLE_METAL=OFF -DENGINE_ENABLE_CUDA=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64'
          - platform: ubuntu-22.04
            runner: ubuntu-22.04
            args: ''
            audiocpp_triple: x86_64-unknown-linux-gnu
            audiocpp_extra: '-DENGINE_ENABLE_CUDA=OFF'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Sync tauri version to tag
        # tauri 打包版本取自 tauri.conf.json，需与 release-plz 打出的 vX.Y.Z tag 对齐。
        # 用 node（各平台 runner 均预装）更新 JSON。
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export VERSION
          node - <<'EOF'
          const fs = require('fs');
          const p = 'src-tauri/tauri.conf.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.version = process.env.VERSION;
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          EOF

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libasound2-dev

      - name: Setup pnpm
        # 版本由根 package.json 的 packageManager 字段决定（pnpm@10.18.2）
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # 版本单一来源 .node-version（本地 fnm 与 CI 读同一文件）
          node-version-file: .node-version
          cache: pnpm

      - name: Install frontend deps
        # 安装除 docs（Next.js）外的所有 workspace：根包（@tauri-apps/cli）+ frontend（React）
        # 注意：--filter 按包名匹配，docs workspace 的包名为 audiofn-docs
        run: pnpm install --filter '!audiofn-docs' --frozen-lockfile

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install macOS cross-compile targets
        if: matrix.platform == 'macos-latest'
        # 安装 macOS 交叉编译 target（aarch64 + x86_64）。
        # dtolnay 装的工具链（1.97.1）与 rust-toolchain.toml 一致；
        # rustup target add 运行于项目目录，遵循 override 装到激活的工具链上。
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo build artifacts
        # 缓存 ~/.cargo + target/。macOS 双 target 矩阵用 args 区分缓存线，
        # 避免两个矩阵条目写同一 key 互相覆盖导致另一半永远冷缓存。
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ matrix.args }}
          # 引擎获取/打包级失败重跑时避免 cargo 全量重编
          cache-on-failure: true

      - name: Build audiocpp_server sidecar
        # TTS/ASR 引擎（audio.cpp，Apache-2.0）的 sidecar 进程：源码裁剪构建只编
        # qwen3_tts + qwen3_asr 两族模型。DEPLOYMENT_BUILD 把 model specs 编进
        # 二进制（否则运行时依赖源码目录的 model_specs/）；
        # NATIVE_CPU=OFF 保证产物可移植（默认 -march=native 只能在构建机级 CPU
        # 上跑）。externalBin 要求带 target triple 后缀的文件名
        # （tauri.conf.json bundle.externalBin）。
        # 引擎版本升级只改 AUDIOCPP_REF（与 tauri.conf.json 同步审查）。
        shell: bash
        env:
          AUDIOCPP_TRIPLE: ${{ matrix.audiocpp_triple }}
          AUDIOCPP_EXTRA: ${{ matrix.audiocpp_extra }}
        run: |
          # AUDIOCPP_REF 来自 workflow 级 env。
          git clone --depth 1 --branch "$AUDIOCPP_REF" https://github.com/0xShug0/audio.cpp .audiocpp-src
          # macOS：Apple Clang 不带 OpenMP。native（arm64）job 装 brew libomp 并以
          # OpenMP_ROOT 定位（keg-only）；x86_64 交叉编译 job 无 x86_64 版 libomp
          # 可用，关 OpenMP（与该 job METAL=OFF 同等的可移植性取舍）。
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [[ "$AUDIOCPP_EXTRA" == *CMAKE_OSX_ARCHITECTURES* ]]; then
              export AUDIOCPP_EXTRA="$AUDIOCPP_EXTRA -DENGINE_ENABLE_OPENMP=OFF"
            else
              brew install libomp
              export OpenMP_ROOT="$(brew --prefix libomp)"
            fi
          fi
          # 各 entry 的 audiocpp_extra 显式带 ENGINE_ENABLE_CUDA（均 OFF）；
          # VULKAN/HIP 两后端全平台关闭。
          COMMON_FLAGS="-DAUDIOCPP_MODEL_SET=custom -DAUDIOCPP_MODELS=qwen3_tts,qwen3_asr \
            -DAUDIOCPP_DEPLOYMENT_BUILD=ON -DENGINE_ENABLE_NATIVE_CPU=OFF \
            -DENGINE_ENABLE_VULKAN=OFF -DENGINE_ENABLE_HIP=OFF"
          # shellcheck disable=SC2086
          cmake -S .audiocpp-src -B .audiocpp-build $COMMON_FLAGS $AUDIOCPP_EXTRA -DCMAKE_BUILD_TYPE=Release
          JOBS="${NUMBER_OF_PROCESSORS:-$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)}"
          cmake --build .audiocpp-build --target audiocpp_server --config Release --parallel "$JOBS"
          # 产物名跨生成器有差异（Ninja 单配置落 bin/，VS 多配置落 bin/Release/），find 兜底
          SRC_BIN=$(find .audiocpp-build -type f -name 'audiocpp_server*' ! -name '*.dSYM*' | head -1)
          test -n "$SRC_BIN" || { echo '::error::audiocpp_server 产物未找到'; exit 1; }
          # 防呆：本步骤假设引擎编为单体可执行（externalBin 只打包这一个文件）。
          # 上游 0.7.x 引入了动态 ggml 后端；若某天 mac/linux 构建也开始产出
          # dylib/so，单发 exe 会缺库无法启动，在这里显式失败，提示扩展打包
          # 而不是发出坏包。
          EXTRA_LIBS=$(find .audiocpp-build -type f \( -name '*.dylib' -o -name '*.so' \) | head -5)
          if [ -n "$EXTRA_LIBS" ]; then
            echo '::error::0.7.x 源码编译产出了动态库（动态 ggml 后端？），单 exe 打包会缺库：'
            echo "$EXTRA_LIBS"
            exit 1
          fi
          mkdir -p src-tauri/binaries
          cp "$SRC_BIN" "src-tauri/binaries/audiocpp_server-${AUDIOCPP_TRIPLE}"
          ls -lh src-tauri/binaries/

      - uses: tauri-apps/tauri-action@v1
        with:
          args: ${{ matrix.args }}
          # macOS 关闭 action 上传、改为下方手动上传：dmg 需先经
          # scripts/patch-dmg-gatekeeper.sh 注入「首次打开修复.command」
          # （未签名应用被 Gatekeeper 报「已损坏」，双击脚本即自动安装 + 修复），
          # 注入必须发生在产物落盘之后、上传之前，action 的上传时机插不进自定义步骤。
          uploadWorkflowArtifacts: ${{ runner.os != 'macOS' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 配置证书后由 tauri-action 自动签名/公证 macOS 产物
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Stage macOS bundles and inject Gatekeeper fixer
        # 产物先拷到 staged/ 扁平目录再上传：upload-artifact 以多行 path 的公共
        # 祖先为根保留目录结构，直接传 bundle/ 会带出 dmg/、macos/ 子目录，
        # release job 下载合并后 `for f in *` 就扫不到文件了。
        # 注意是仓库根 target/ 而非 src-tauri/target/：根 Cargo.toml 定义了
        # workspace，cargo 把产物统一放在 workspace 根 target/ 下按 triple 分目录。
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          BUNDLE="target/${{ matrix.triple }}/release/bundle"
          shopt -s nullglob
          DMGS=("$BUNDLE"/dmg/*.dmg)
          # 空 glob 防呆：路径写错/布局变化时立刻失败并打出目录树，而不是发布出
          # 一个没有 dmg 的 Release。只校验 dmg：本仓库未启用 updater，
          # 不产出 .app.tar.gz（已核实历史 Release 资产）。
          if [ ${#DMGS[@]} -eq 0 ]; then
            echo "::error::未找到 dmg 产物: $BUNDLE/dmg/"
            ls -R "$BUNDLE" || true
            exit 1
          fi
          mkdir -p staged
          cp "${DMGS[@]}" staged/
          for dmg in staged/*.dmg; do
            # tauri bundle_dmg 刚 detach 过同卷名（AudioFn）镜像，diskarbitration
            # 释放有延迟，patch 脚本里的 hdiutil attach 偶发 Mount failed
            # （exit 16；run #34 x64 腿实测，与成功的 arm64 腿只差几秒）。
            # 脚本 set -e 即刻中止且 WORK 目录每次全新，外层等待后重试即可。
            for attempt in 1 2 3; do
              if ./scripts/patch-dmg-gatekeeper.sh "$dmg"; then
                break
              elif [ "$attempt" -eq 3 ]; then
                echo "::error::dmg patch 三次均失败: $dmg"
                exit 1
              fi
              echo "::warning::dmg patch 第 ${attempt} 次失败（疑似卷释放竞态），10 秒后重试"
              sleep 10
            done
          done
          ls -l staged

      - name: Upload macOS bundles
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          # 双架构同为 macos-latest，platform 无法区分，按 triple 命名；
          # release job 的 download-artifact 用 pattern '*' 合并，名字只需唯一
          name: bundle-${{ matrix.triple }}
          path: staged/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: "Guard: only publish from v* tags"
        # 本 workflow 也可 workflow_dispatch 手动触发（验证构建用），但下方
        # softprops 会以 github.ref_name（分支名）为 tag 建公开 Release 并触发
        # upload-baidu-pan.yml，必须硬拦：仅 v* tag 允许走到发布。
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "::error::release job 仅支持 v* tag 触发；workflow_dispatch 只用于验证构建，不发布。"
          exit 1

      - uses: actions/download-artifact@v8
        with:
          pattern: '*'
          merge-multiple: true

      - name: Rename installers to user-friendly asset names
        # Tauri 产物默认名对普通用户不友好：平台术语混杂
        # （x64-setup / aarch64 / amd64 / x86_64），macOS 双架构无选择指引。
        # 统一重命名为
        # <产品>_<平台>_<架构>.<后缀>，Release 资产列表按平台自动分组排序。
        # 刻意不注入版本号：资产名跨版本保持不变，README 的
        # releases/latest/download/<文件名> 直链因此永远指向最新版，
        # 用户无需访问 Release 页即可一键下载。代价是下载到本地的文件名不含
        # 版本号（0.1.x 阶段可接受）；未来启用 Tauri updater 时需恢复版本化资产。
        # 未启用 updater（无 .sig 签名文件），重命名不影响任何校验。
        # 注意：aarch64.dmg 分支必须在 x64.dmg 之前（前者同样匹配 *x64.dmg）。
        shell: bash
        run: |
          shopt -s nullglob
          for f in *; do
            case "$f" in
              *aarch64.dmg)    mv "$f" "AudioFn_macOS_arm64.dmg" ;;
              *x64.dmg)        mv "$f" "AudioFn_macOS_x64.dmg" ;;
              *amd64.deb)      mv "$f" "AudioFn_Linux_amd64.deb" ;;
              *x86_64.rpm)     mv "$f" "AudioFn_Linux_x86_64.rpm" ;;
              *amd64.AppImage) mv "$f" "AudioFn_Linux_amd64.AppImage" ;;
            esac
          done
          ls -1

      - name: Generate release body (download guide)
        # 生成带「平台选择表格 + 下载按钮」的正文。资产名不含版本号（见上方
        # rename step），故链接用 <tag>/<固定文件名> 指向本次发布的具体资产。
        # generate_release_notes 的自动变更日志会追加在 body 之后（表格在上、changelog 在下）。
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > release_body.md <<EOF
          ## 📦 下载

          | 系统 | 芯片 / 架构 | 下载 | 说明 |
          | --- | --- | --- | --- |
          | **macOS 13+** | Apple Silicon（M1/M2/M3/M4） | [![macOS](https://img.shields.io/badge/download-arm64.dmg-8E8E93?logo=apple)](${BASE}/AudioFn_macOS_arm64.dmg) | 不确定芯片？见下方说明 |
          | **macOS 13+** | Intel | [![macOS](https://img.shields.io/badge/download-x64.dmg-8E8E93?logo=apple)](${BASE}/AudioFn_macOS_x64.dmg) | — |
          | **Ubuntu / Debian** | amd64 | [![deb](https://img.shields.io/badge/download-amd64.deb-A80030?logo=debian&logoColor=white)](${BASE}/AudioFn_Linux_amd64.deb) | 或 [AppImage](${BASE}/AudioFn_Linux_amd64.AppImage) 免安装运行 |
          | **Fedora / RHEL** | x86_64 | [![rpm](https://img.shields.io/badge/download-x86_64.rpm-294172?logo=fedora&logoColor=white)](${BASE}/AudioFn_Linux_x86_64.rpm) | 或 [AppImage](${BASE}/AudioFn_Linux_amd64.AppImage) 免安装运行 |

          > 🍎 **Mac 用户看这里：**
          > 1. 不确定选哪个？点按左上角  菜单 →「关于本机」：显示「芯片：Apple M…」下载 **arm64** 版；显示「处理器：Intel Core…」下载 **x64** 版。
          > 2. 首次打开若提示「"AudioFn" 已损坏，无法打开」，并非真的损坏（应用未做 Apple 签名公证，被 Gatekeeper 拦截）：**双击 dmg 窗口里的「首次打开修复.command」**，自动安装到「应用程序」、清除隔离属性并启动；也可手动执行终端命令 \`xattr -cr /Applications/AudioFn.app\`。详见 README「macOS 首次打开」一节。
          EOF
          cat release_body.md

      - name: Check release token
        # 发布前确认 PAT_TOKEN 可用，缺失/过期时在这里报清晰错误，避免发布 job
        # 跑到最后一步才失败（见文件头注释，为何不能用 GITHUB_TOKEN）。该 Secret
        # 与 publish.yml 的 release-plz 共用，正常不会缺失；报错多半意味着 PAT
        # 已过期——需换新后同步更新 Secret，否则 release-plz 同样会失败。
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "::error::缺少 PAT_TOKEN Secret（publish.yml 的 release-plz 也在使用，正常不应缺失，请检查是否被误删）。"
            exit 1
          fi

      - name: Attach installers to draft release
        uses: softprops/action-gh-release@v3
        with:
          # 显式传 PAT：用 GITHUB_TOKEN 发布的 release 事件不会触发
          # upload-baidu-pan.yml（GitHub 防递归机制，事件被静默丢弃）
          token: ${{ secrets.PAT_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          body_path: release_body.md
          generate_release_notes: true
          files: |
            *.dmg
            *.app.tar.gz
            *.deb
            *.rpm
            *.AppImage
