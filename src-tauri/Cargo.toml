[package]
name = "zapmomo-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
license.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 可执行文件名与包名解耦：产出 ZapMomo 而非 zapmomo-app，
# `tauri dev` 裸跑二进制时 Cmd+Tab / 活动监视器显示 ZapMomo。
# 包名 zapmomo-app 保留，CI / release-plz 的 -p 引用不受影响。
[[bin]]
name = "ZapMomo"
path = "src/main.rs"

[dependencies]
# Tauri 桌面框架（protocol-asset 用于通过 asset:// 协议把本地音频/模型文件喂给
# WebView；tray-icon 用于常驻托盘图标；image-png 用于加载托盘图标）
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }

# 文件/目录选择对话框（用户注册本地模型、选择参考音频）
tauri-plugin-dialog = "2"

# 系统级全局快捷键（Rust 侧注册与分发；设置页经自定义 command 间接操作）
tauri-plugin-global-shortcut = "2"

# 开机自启动（LaunchAgent / Run 键 / XDG .desktop，Rust 侧经自定义 command 操作；
# 系统注册即唯一真值，不在 settings.toml 落盘）
tauri-plugin-autostart = "2"

# 单实例防护：自启常驻后手动再点图标激活已有实例，而非拉起第二个桌宠
tauri-plugin-single-instance = "2"

# 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 日志（复用根 crate 的 init_logging 初始化双层 tracing）
tracing = "0.1"

# 复用根 crate 的音频 / 配置 / 模型库逻辑
zapmomo = { path = ".." }

[dev-dependencies]
tempfile = "3"
